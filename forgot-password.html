<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Games — Reset password</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> Focus Games</div>
  </div>

  <div class="container">
    <div class="card">
      <h1>Reset your password</h1>
      <p class="subtitle">Enter your email and we'll send you a link to set a new password.</p>

      <div class="error-box" id="error-box"></div>
      <div class="info-box" id="info-box"></div>

      <form id="forgot-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" />

        <button type="submit" class="btn-primary" id="submit-btn">Send reset link</button>
      </form>

      <p class="toggle-row">
        <a href="index.html">Back to log in</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
