<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Games — Sign in</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> Focus Games</div>
  </div>

  <div class="container">
    <div class="card">
      <h1 id="form-title">Welcome back</h1>
      <p class="subtitle" id="form-subtitle">Log in to keep training your attention span.</p>

      <div class="error-box" id="error-box"></div>
      <div class="info-box" id="info-box"></div>

      <form id="auth-form">
        <div id="name-field" style="display:none;">
          <label for="display-name">Display name</label>
          <input type="text" id="display-name" placeholder="Nandini" autocomplete="name" />
        </div>

        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" />

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="At least 6 characters" minlength="6" />

        <button type="submit" class="btn-primary" id="submit-btn">Log in</button>
      </form>

      <p class="toggle-row" id="toggle-row">
        New here? <a id="toggle-link">Create an account</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
