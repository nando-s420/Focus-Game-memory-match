<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Games — Set new password</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> Focus Games</div>
  </div>

  <div class="container">
    <div class="card">
      <h1>Set a new password</h1>
      <p class="subtitle" id="page-subtitle">Checking your reset link…</p>

      <div class="error-box" id="error-box"></div>
      <div class="info-box" id="info-box"></div>

      <form id="reset-form" style="display:none;">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" />

        <label for="confirm-password">Confirm new password</label>
        <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password" placeholder="Re-enter your new password" />

        <button type="submit" class="btn-primary" id="submit-btn">Set new password</button>
      </form>

      <p class="toggle-row" id="back-link" style="display:none;">
        <a href="forgot-password.html">Request a new link</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
